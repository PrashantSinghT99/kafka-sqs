name: mqtest-local

x-app-environment: &app-environment
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC: orders.created.local
  KAFKA_DLQ_TOPIC: orders.created.local.dlq
  KAFKA_CONSUMER_GROUP: local-order-consumer
  SQS_ENDPOINT_URL: http://localstack:4566
  SQS_QUEUE_NAME: orders-created-local
  SQS_DLQ_NAME: orders-created-local-dlq
  AWS_DEFAULT_REGION: us-east-1
  POSTGRES_DSN: postgresql://mqtest:mqtest@postgres:5432/mqtest
  KAFKA_SCHEMA: kafka_lab
  SQS_SCHEMA: sqs_lab
  KAFKA_CONSOLE_URL: http://127.0.0.1:8088
  ADMINER_URL: http://127.0.0.1:8089

x-app-image: &app-image
  image: mqtest-local-app:latest

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: mqtest-local-kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  kafka-console:
    image: docker.redpanda.com/redpandadata/console:v3.9.0
    container_name: mqtest-local-kafka-console
    environment:
      KAFKA_BROKERS: kafka:9092
      SERVER_LISTENPORT: 8080
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16.4-alpine
    container_name: mqtest-local-postgres
    environment:
      POSTGRES_DB: mqtest
      POSTGRES_USER: mqtest
      POSTGRES_PASSWORD: mqtest
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mqtest -d mqtest"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  adminer:
    image: adminer:5.5.0
    container_name: mqtest-local-adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8089:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  localstack:
    image: localstack/localstack:3.5.0
    container_name: mqtest-local-localstack
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: "1"
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health | grep -q '\"sqs\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  lab-init:
    <<: *app-image
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: mqtest-local-init
    command: ["python", "-m", "sample_app.local_lab.initialize"]
    environment: *app-environment
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: "no"

  kafka-worker:
    <<: *app-image
    container_name: mqtest-local-kafka-worker
    command: ["python", "-m", "sample_app.local_lab.workers", "kafka"]
    environment: *app-environment
    depends_on:
      lab-init:
        condition: service_completed_successfully
    restart: unless-stopped

  sqs-worker:
    <<: *app-image
    container_name: mqtest-local-sqs-worker
    command: ["python", "-m", "sample_app.local_lab.workers", "sqs"]
    environment: *app-environment
    depends_on:
      lab-init:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    <<: *app-image
    container_name: mqtest-local-dashboard
    command:
      - uvicorn
      - sample_app.local_lab.app:create_local_lab_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment: *app-environment
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3))['status'] == 'ready'"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      lab-init:
        condition: service_completed_successfully
      kafka-worker:
        condition: service_started
      sqs-worker:
        condition: service_started
    restart: unless-stopped

volumes:
  kafka-data:
  postgres-data:
  localstack-data:
