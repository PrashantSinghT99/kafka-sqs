name: messaging-test-framework

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-contract:
    name: Unit and contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Check dependencies
        run: python -m pip check
      - name: Run fast suites
        run: python -m pytest -m "unit or contract" --junitxml=test-results/unit-contract.xml
      - name: Upload fast-suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-contract-results
          path: test-results/*.xml
          if-no-files-found: warn

  kafka-integration:
    name: Kafka integration
    needs: unit-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run Kafka and PostgreSQL suites
        run: python -m pytest -m "integration and kafka" --junitxml=test-results/kafka.xml
      - name: Upload Kafka evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kafka-results
          path: test-results/*.xml
          if-no-files-found: warn

  sqs-integration:
    name: SQS integration
    needs: unit-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run LocalStack and PostgreSQL suites
        run: python -m pytest -m "integration and sqs" --junitxml=test-results/sqs.xml
      - name: Upload SQS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqs-results
          path: test-results/*.xml
          if-no-files-found: warn
